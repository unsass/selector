<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" style="display:block">
    <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="0.8" cy="0.8" r="0.7" fill="#fff" opacity="0.05"/>
        </pattern>
    </defs>

    <rect width="800" height="340" fill="#1d242a"/>
    <rect width="800" height="340" fill="url(#dots)"/>
    <rect width="800" height="340" rx="12" fill="none" stroke="#33403f"/>
    <rect width="800" height="2.5" fill="#1ad1cb" opacity="0.9"/>

    <!-- selected element icon -->
    <g transform="translate(400, 44)">
        <rect x="-26" y="-18" width="52" height="36" rx="4" fill="none" stroke="#1ad1cb" stroke-width="1.2"
              stroke-dasharray="4 3" opacity="0.55"/>
        <rect x="-15" y="-9" width="30" height="18" rx="3" fill="#1ad1cb" fill-opacity="0.18" stroke="#1ad1cb"
              stroke-width="1.5"/>
        <g fill="#1ad1cb">
            <rect x="-28" y="-20" width="4" height="4"/>
            <rect x="24" y="-20" width="4" height="4"/>
            <rect x="-28" y="16" width="4" height="4"/>
            <rect x="24" y="16" width="4" height="4"/>
        </g>
    </g>

    <!-- "selector" wordmark in Montserrat Medium (matches the docs display font) -->
    <text x="400" y="102" text-anchor="middle" font-size="30" font-weight="500" fill="#eeeeee" letter-spacing="0.5"
          font-family="Montserrat,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">selector</text>
    <text x="400" y="124" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11"
          fill="#1ad1cb" opacity="0.8">Sass functions and mixins to manage CSS selectors</text>

    <!-- code mockup: install + use -->
    <rect x="130" y="148" width="540" height="158" rx="10" fill="#151c22" stroke="#2c3942"/>
    <rect x="130" y="148" width="540" height="28" rx="10" fill="#19232b"/>
    <rect x="130" y="166" width="540" height="10" fill="#19232b"/>
    <line x1="130" y1="176" x2="670" y2="176" stroke="#2c3942" stroke-width="0.75"/>
    <circle cx="152" cy="162" r="4.5" fill="#ff5f57"/>
    <circle cx="168" cy="162" r="4.5" fill="#febc2e"/>
    <circle cx="184" cy="162" r="4.5" fill="#28c840"/>

    <g font-family="ui-monospace,Menlo,monospace" font-size="13">
        <text x="150" y="204">
            <tspan fill="#1ad1cb">@use </tspan><tspan fill="#7fd88f">"@unsass/selector"</tspan><tspan fill="#c8d0d4">;</tspan>
        </text>
        <text x="150" y="246">
            <tspan fill="#1ad1cb">@include</tspan><tspan fill="#c8d0d4"> selector.create(</tspan><tspan fill="#7fd88f">"foo"</tspan><tspan fill="#c8d0d4">, </tspan><tspan fill="#7fd88f">"md"</tspan><tspan fill="#c8d0d4">) {</tspan>
        </text>
        <text x="174" y="268">
            <tspan fill="#c8d0d4">color: </tspan><tspan fill="#e0a973">darkcyan</tspan><tspan fill="#c8d0d4">;</tspan>
        </text>
        <text x="150" y="290"><tspan fill="#c8d0d4">}</tspan></text>
    </g>
</svg>
